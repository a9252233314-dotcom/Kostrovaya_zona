<text x="1194" y="420" class="t">2200*</text><text x="1194" y="446" class="small">в свету</text>
<text x="785" y="195" class="small">Уклон около 31° — только для эскиза*</text>
<text x="725" y="650" class="small">* Принято для модели: проход 2200, свесы 300.</text>
<text x="725" y="676" class="small">Высота конька ориентировочно 3150 от площадки;</text>
<text x="725" y="700" class="small">уточняется после выбора узлов и сечений.</text>
<path d="M55 745H1345" class="thin"/>
<text x="55" y="780" class="t">Стойки и обвязка: 40 × 40 × 2. Крыша: предварительно 15 × 15 × 1, лист оцинкованный 0,3.</text>
<text x="55" y="812" class="t">Оранжевым — положения соединительных узлов. Трубы надеваются на вставки и крепятся болтами.</text>
<text x="55" y="844" class="t">Раскосы, прогоны крыши, болты, вставки и опоры предстоит проработать; на эскизе они не показаны.</text>
<text x="55" y="876" class="t">Сечения, нагрузки, крепление покрытия и основания требуют проверки до изготовления.</text>
